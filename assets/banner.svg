<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <!-- Accent Gradient for Text/Shapes -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow for Text Readability -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(1) translate(0, 0); }
      50% { opacity: 0.65; transform: scale(1.08) translate(-10px, 15px); }
      100% { opacity: 0.3; transform: scale(1) translate(0, 0); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(180deg); }
      100% { transform: translateY(0px) rotate(360deg); }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 100; }
    }
    .bg-orb-1 {
      animation: pulseGlow 8s ease-in-out infinite;
      transform-origin: center;
    }
    .bg-orb-2 {
      animation: pulseGlow 11s ease-in-out infinite reverse;
      transform-origin: center;
    }
    .particle {
      animation: floatParticle 6s ease-in-out infinite;
      transform-origin: center;
    }
    .grid-line {
      stroke: #475569;
      stroke-opacity: 0.15;
      stroke-width: 1;
    }
    .animated-wave {
      stroke-dasharray: 12 8;
      animation: dashMove 20s linear infinite;
    }
  </style>

  <!-- Base Card background -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)"/>

  <!-- Dynamic / Animated Background Orbs (behind text) -->
  <circle class="bg-orb-1" cx="200" cy="80" r="180" fill="#38bdf8" opacity="0.25" filter="url(#glow)"/>
  <circle class="bg-orb-2" cx="1000" cy="260" r="220" fill="#c084fc" opacity="0.2" filter="url(#glow)"/>
  <circle class="bg-orb-1" cx="600" cy="300" r="140" fill="#6366f1" opacity="0.2" filter="url(#glow)"/>

  <!-- Geometric Grid Background Pattern -->
  <line x1="0" y1="80" x2="1200" y2="80" class="grid-line"/>
  <line x1="0" y1="170" x2="1200" y2="170" class="grid-line"/>
  <line x1="0" y1="260" x2="1200" y2="260" class="grid-line"/>
  <line x1="200" y1="0" x2="200" y2="340" class="grid-line"/>
  <line x1="600" y1="0" x2="600" y2="340" class="grid-line"/>
  <line x1="1000" y1="0" x2="1000" y2="340" class="grid-line"/>

  <!-- Dynamic Wave Tech Lines -->
  <path d="M-50,220 Q 300,120 600,220 T 1250,180" fill="none" stroke="url(#accentGrad)" stroke-width="2" class="animated-wave" opacity="0.4"/>
  <path d="M-50,250 Q 350,290 700,180 T 1250,230" fill="none" stroke="#38bdf8" stroke-width="1.5" class="animated-wave" opacity="0.3"/>

  <!-- Floating Decorative Icons / Shapes -->
  <g class="particle" style="animation-delay: 0s;">
    <polygon points="120,60 135,90 105,90" fill="#38bdf8" opacity="0.5"/>
  </g>
  <g class="particle" style="animation-delay: 2s;">
    <rect x="1050" y="70" width="18" height="18" rx="4" fill="#c084fc" opacity="0.6"/>
  </g>
  <g class="particle" style="animation-delay: 4s;">
    <circle cx="920" cy="280" r="8" fill="#f43f5e" opacity="0.6"/>
  </g>

  <!-- Foreground Content Block -->
  <!-- Top Category Badge -->
  <g filter="url(#shadow)">
    <rect x="80" y="45" width="230" height="32" rx="16" fill="url(#badgeGrad)"/>
    <text x="195" y="66" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2" text-anchor="middle">🔍 AWESOME LIST 2026</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="145" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#shadow)">
    Awesome Mystery Shopping Platform
  </text>

  <!-- Subtitle -->
  <text x="80" y="195" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" filter="url(#shadow)">
    Curated SaaS Platforms, Open-Source Tools &amp; CX Audit Infrastructure
  </text>

  <!-- Feature Pills -->
  <g filter="url(#shadow)">
    <!-- Pill 1 -->
    <rect x="80" y="240" width="175" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="167" y="262" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">🛒 SaaS Products</text>

    <!-- Pill 2 -->
    <rect x="270" y="240" width="195" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="367" y="262" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">⚡ Open-Source Repos</text>

    <!-- Pill 3 -->
    <rect x="480" y="240" width="200" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="580" y="262" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">📊 Field Data &amp; Audits</text>
  </g>
</svg>
